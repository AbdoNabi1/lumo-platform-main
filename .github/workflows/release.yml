name: Release

# Cut a release on a semantic version tag. Enforces the full gate (validate + security) BEFORE
# building and pushing immutable image tags, then publishes a GitHub Release carrying the digest.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # create the release
  packages: write # push to GHCR
  security-events: write
  id-token: write # cosign keyless OIDC signing (H-5)

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  security:
    uses: ./.github/workflows/security.yml

  build:
    needs: [validate, security]
    uses: ./.github/workflows/build.yml
    with:
      push: true
    secrets: inherit

  sign:
    name: sign image (cosign keyless)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write # OIDC token for keyless signing (Fulcio/Rekor)
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Sign the immutable digest (never a tag). Keyless: identity = this workflow, logged to Rekor.
      - name: Sign runtime image
        run: cosign sign --yes ghcr.io/${{ github.repository }}/runtime@${{ needs.build.outputs.digest }}

  release:
    name: publish release
    needs: [build, sign]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # H-5: derive the changelog from Changesets when present, else fall back to GitHub's autonotes.
      - name: Assemble changelog
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            echo "has_changelog=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changelog=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ### Runtime image
            - Tags: `${{ needs.build.outputs.image }}`
            - Immutable digest: `${{ needs.build.outputs.digest }}`
            - Signature: cosign keyless (verify per docs/operations/DEPLOYMENT_GUIDE.md)

            Deploy with the `Deploy` workflow, passing this digest as `image_digest`.
