name: Setup pnpm + Node
description: >-
  Installs pnpm (version pinned by the repo's package.json `packageManager`) and Node 22, restores
  the pnpm cache, and installs dependencies with a frozen lockfile. Single source of truth for
  toolchain setup so no workflow duplicates it.
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4 # reads `packageManager: pnpm@11.9.0` from package.json
    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
