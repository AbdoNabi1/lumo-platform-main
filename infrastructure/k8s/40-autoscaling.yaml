# Phase A.34: Hydra/Kratos/Keto keep static replicas (71/72/73-*.yaml, 2 each) rather than HPA —
# their load scales with admin-web's own bounded operator traffic, not customer-facing peaks
# (contrast doc 15 §1.3's 50x Black-Friday planning, which is about storefront/checkout/runtime-api).
# A disruption budget alone is what's needed to keep availability during node drains.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hydra
  namespace: lumo-runtime
  labels:
    app.kubernetes.io/part-of: lumo
    app.kubernetes.io/name: hydra
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hydra
