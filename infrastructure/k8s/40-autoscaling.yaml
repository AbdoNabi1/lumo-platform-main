---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: collector
  namespace: lumo-runtime
  labels:
    app.kubernetes.io/part-of: lumo
    app.kubernetes.io/name: collector
spec:
  minAvailable: 1
  selector:
