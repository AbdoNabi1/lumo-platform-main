# Horizontal autoscaling for the stateless/parallelizable workloads. CPU-based (utilisation is
# relative to the pods' CPU requests). No HPA for the scheduler (singleton by design).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: runtime-api
  namespace: lumo-runtime
  labels:
    app.kubernetes.io/part-of: lumo
    app.kubernetes.io/name: runtime-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: runtime-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: runtime-worker
  namespace: lumo-runtime
  labels:
    app.kubernetes.io/part-of: lumo
    app.kubernetes.io/name: runtime-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: runtime-worker
  minReplicas: 2
  # Consumer parallelism is bounded by the topic's 6 partitions — never scale past useful readers.
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
# Disruption budgets keep availability during voluntary disruptions (node drains, upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: runtime-api
  namespace: lumo-runtime
  labels:
    app.kubernetes.io/part-of: lumo
    app.kubernetes.io/name: runtime-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: runtime-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: runtime-worker
  namespace: lumo-runtime
  labels:
    app.kubernetes.io/part-of: lumo
    app.kubernetes.io/name: runtime-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: runtime-worker
---
# Singleton scheduler: allow the single pod to be evicted for node maintenance (it reschedules
# and re-acquires the Redis lock). minAvailable:1 here would wedge drains.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: runtime-scheduler
  namespace: lumo-runtime
  labels:
    app.kubernetes.io/part-of: lumo
    app.kubernetes.io/name: runtime-scheduler
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: runtime-scheduler
---
