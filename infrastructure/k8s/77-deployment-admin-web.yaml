# Phase A.34 (A.33 Task 1/2/6/11/20) — production Deployment for admin-web. Mirrors
# 28-deployment-storefront.yaml's structure exactly (both are Next.js `output: standalone` images
# built the same way — infrastructure/docker/admin-web.Dockerfile). This is the deployment target
# decision documented in PHASE_A34_PRODUCTION_REMEDIATION_REPORT.md: in-cluster (EKS), the platform's
# own documented production target (docs/architecture/15-scalability-and-deployment.md), not
# Vercel — running in-cluster is what lets admin-web reach Hydra's/Kratos's zero-auth admin APIs
# safely over the private network instead of needing them exposed publicly. admin-web remains
# mechanically Vercel-deployable too (A.33 Task 2's verdict is unchanged) for anyone who later
# decides to split it out; see the report for the tradeoff if that path is chosen instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-web
  namespace: morbeh-runtime
  labels:
    app.kubernetes.io/part-of: morbeh
    app.kubernetes.io/name: admin-web
    app.kubernetes.io/component: admin-web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-web
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: morbeh
        app.kubernetes.io/name: admin-web
        app.kubernetes.io/component: admin-web
    spec:
      serviceAccountName: morbeh-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001 # admin-web.Dockerfile creates `nextjs` as uid 1001, same as web.Dockerfile
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: admin-web
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: admin-web
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: admin-web
      containers:
        - name: admin-web
          image: morbeh-admin-web:local # production: a registry-pushed, immutable tag or digest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3100
          envFrom:
            - configMapRef:
                name: morbeh-admin-web-config
            - secretRef:
                name: morbeh-admin-web-secrets
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
