# Phase A.34 (A.33 P0 #1/#2) — production deployment for Ory Kratos (identity/session). Mounts the
# SAME infrastructure/docker/kratos/{kratos.yml,identity.schema.json} local-dev config (via
# kustomize's configMapGenerator, kustomization.yaml) and overrides it for production via Ory's
# built-in config-path env vars — DSN, SERVE_PUBLIC_BASE_URL, SERVE_PUBLIC_CORS_ALLOWED_ORIGINS,
# SELFSERVICE_DEFAULT_BROWSER_RETURN_URL, SELFSERVICE_ALLOWED_RETURN_URLS,
# SELFSERVICE_FLOWS_ERROR_UI_URL, SELFSERVICE_FLOWS_LOGIN_UI_URL,
# SELFSERVICE_FLOWS_REGISTRATION_UI_URL, SESSION_COOKIE_DOMAIN, SECRETS_COOKIE, SECRETS_CIPHER.
#
# `serve` (no `--dev`, no `--watch-courier` change) drops the dev-secret-strength relaxation.
# `--watch-courier` IS kept: no separate courier worker exists, so this process still has to
# dispatch outgoing mail (password recovery/verification) itself, same as local dev.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lumo-kratos-config
  namespace: lumo-runtime
  labels:
    app.kubernetes.io/part-of: lumo
    app.kubernetes.io/name: kratos
data:
  SERVE_PUBLIC_BASE_URL: "https://identity.lumo.example.com/"
  SERVE_ADMIN_BASE_URL: "http://kratos.lumo-runtime.svc.cluster.local:4434/"
  SERVE_PUBLIC_CORS_ENABLED: "true"
  SERVE_PUBLIC_CORS_ALLOWED_ORIGINS: "https://admin.lumo.example.com"
  SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: "https://admin.lumo.example.com/"
  SELFSERVICE_ALLOWED_RETURN_URLS: "https://admin.lumo.example.com"
  SELFSERVICE_FLOWS_ERROR_UI_URL: "https://admin.lumo.example.com/error"
  SELFSERVICE_FLOWS_LOGIN_UI_URL: "https://admin.lumo.example.com/login"
  SELFSERVICE_FLOWS_REGISTRATION_UI_URL: "https://admin.lumo.example.com/registration"
  # Shared registrable parent domain with admin-web (COOKIE_DOMAIN in 76-admin-web-config.yaml) —
  # this is what lets Kratos's session cookie reach admin-web across the auth/admin domain split
  # (A.33 P0 #6; see kratos.yml's own doc comment for why this must match on both sides).
  SESSION_COOKIE_DOMAIN: ".lumo.example.com"
  LOG_LEVEL: "info"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kratos-migrate
  namespace: lumo-runtime
  labels:
    app.kubernetes.io/part-of: lumo
    app.kubernetes.io/name: kratos
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: lumo
        app.kubernetes.io/name: kratos
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: oryd/kratos:v1.1.0
          command:
            ["kratos", "migrate", "sql", "-e", "--yes", "-c", "/etc/config/kratos/kratos.yml"]
          envFrom:
            - secretRef:
                name: lumo-kratos-secrets # DSN
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/config/kratos
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kratos-file-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kratos
  namespace: lumo-runtime
  labels:
    app.kubernetes.io/part-of: lumo
    app.kubernetes.io/name: kratos
    app.kubernetes.io/component: identity
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kratos
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: lumo
        app.kubernetes.io/name: kratos
        app.kubernetes.io/component: identity
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4434"
        prometheus.io/path: "/admin/metrics/prometheus"
    spec:
      serviceAccountName: lumo-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kratos
      containers:
        - name: kratos
          image: oryd/kratos:v1.1.0
          imagePullPolicy: IfNotPresent
          command: ["kratos", "serve", "--watch-courier", "-c", "/etc/config/kratos/kratos.yml"]
          ports:
            - name: public
              containerPort: 4433
            - name: admin
              containerPort: 4434
          envFrom:
            - configMapRef:
                name: lumo-kratos-config
            - secretRef:
                name: lumo-kratos-secrets
          startupProbe:
            httpGet:
              path: /admin/health/ready
              port: admin
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /admin/health/alive
              port: admin
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /admin/health/ready
              port: admin
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/config/kratos
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kratos-file-config
---
# Public self-service endpoints only (4433) go through the Ingress. The admin API (4434 — identity
# CRUD, session revocation, ZERO auth of its own) stays cluster-internal, reachable only from
# admin-web's pods (50-networkpolicy.yaml).
apiVersion: v1
kind: Service
metadata:
  name: kratos
  namespace: lumo-runtime
  labels:
    app.kubernetes.io/part-of: lumo
    app.kubernetes.io/name: kratos
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kratos
  ports:
    - name: public
      port: 4433
      targetPort: public
    - name: admin
      port: 4434
      targetPort: admin
