# H-07: the collector had no Dockerfile, no Deployment/Service/Ingress, and no image build — this
# manifest, its Service (30-services.yaml), and its Ingress (60-ingress.yaml) close that gap. Same
# security posture as the runtime Deployments (20-deployment-api.yaml): non-root, dropped
# capabilities, read-only rootfs, topology spread, PDB via 40-autoscaling.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: lumo-runtime
  labels:
    app.kubernetes.io/part-of: lumo
    app.kubernetes.io/name: collector
    app.kubernetes.io/component: collector
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: lumo
        app.kubernetes.io/name: collector
        app.kubernetes.io/component: collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3200"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: lumo-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: collector
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: collector
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: collector
      containers:
        - name: collector
          image: lumo-collector:local # production: a registry-pushed, immutable tag or digest
          imagePullPolicy: IfNotPresent
          args: ["node", "--import", "tsx", "src/main.ts"]
          ports:
            - name: http
              containerPort: 3200
          envFrom:
            - configMapRef:
                name: lumo-collector-config
            - secretRef:
                name: lumo-collector-secrets
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # H-07: now reflects the Kafka producer's real connection state (main.ts registers a
            # "kafka-producer" health check) — a collector whose producer has dropped is no longer
            # reported ready, instead of unconditionally healthy.
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
