# TEMPLATE ONLY — DO NOT COMMIT REAL SECRETS AND DO NOT `kubectl apply` THIS FILE AS-IS.
#
# The Deployments reference a Secret named `morbeh-runtime-secrets` (via envFrom.secretRef). Provision
# it out-of-band with your secret manager (External Secrets Operator, Sealed Secrets, Vault Agent,
# or a CI-injected `kubectl create secret`). It carries ONLY the two credentialed URLs from the
# runtime config contract; every other key lives in the ConfigMap. This file is intentionally left
# out of kustomization.yaml so no placeholder secret is ever applied.
#
# Example provisioning (values are placeholders):
#   kubectl -n morbeh-runtime create secret generic morbeh-runtime-secrets \
#     --from-literal=DATABASE_URL='postgresql://USER:PASSWORD@postgres.data.svc.cluster.local:5432/lumo' \
#     --from-literal=REDIS_URL='redis://:PASSWORD@redis.data.svc.cluster.local:6379'
apiVersion: v1
kind: Secret
metadata:
  name: morbeh-runtime-secrets
  namespace: morbeh-runtime
  labels:
    app.kubernetes.io/part-of: morbeh
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME__postgresql://USER:PASSWORD@postgres.data.svc.cluster.local:5432/lumo"
  REDIS_URL: "REPLACE_ME__redis://:PASSWORD@redis.data.svc.cluster.local:6379"
---
# H-07: the collector Deployment (26-deployment-collector.yaml) references `morbeh-collector-secrets`
# via envFrom.secretRef. COLLECTOR_WRITE_KEYS binds each write key to a tenant — provision it
# out-of-band, same convention as `morbeh-runtime-secrets` above.
#   kubectl -n morbeh-runtime create secret generic morbeh-collector-secrets \
#     --from-literal=COLLECTOR_WRITE_KEYS='REPLACE_ME__wk_live_xxx:tenant-a,wk_live_yyy:tenant-b'
apiVersion: v1
kind: Secret
metadata:
  name: morbeh-collector-secrets
  namespace: morbeh-runtime
  labels:
    app.kubernetes.io/part-of: morbeh
type: Opaque
stringData:
  COLLECTOR_WRITE_KEYS: "REPLACE_ME__wk_live_xxx:tenant-a"
---
# Phase A.34 (A.33 P0 #1/#8) — Hydra/Kratos/Keto persistence + system secrets. DSNs point at the
# dedicated roles/databases the init script provisions (infrastructure/docker/postgres/init/
# 01-roles-and-cdc.sql). SECRETS_SYSTEM/SECRETS_COOKIE/SECRETS_CIPHER must each be a real random
# value >=16 chars (Hydra) / 32 chars (Kratos) — generate with e.g. `openssl rand -hex 32` — never
# the dev placeholders committed in hydra.yml/kratos.yml/docker-compose.yml.
#   kubectl -n morbeh-runtime create secret generic morbeh-hydra-secrets \
#     --from-literal=DSN='postgres://hydra:PASSWORD@postgres.data.svc.cluster.local:5432/hydra?sslmode=require' \
#     --from-literal=SECRETS_SYSTEM='REPLACE_ME__openssl rand -hex 32'
apiVersion: v1
kind: Secret
metadata:
  name: morbeh-hydra-secrets
  namespace: morbeh-runtime
  labels:
    app.kubernetes.io/part-of: morbeh
type: Opaque
stringData:
  DSN: "REPLACE_ME__postgres://hydra:PASSWORD@postgres.data.svc.cluster.local:5432/hydra?sslmode=require"
  SECRETS_SYSTEM: "REPLACE_ME__32-plus-char-random-value"
---
#   kubectl -n morbeh-runtime create secret generic morbeh-kratos-secrets \
#     --from-literal=DSN='postgres://kratos:PASSWORD@postgres.data.svc.cluster.local:5432/kratos?sslmode=require' \
#     --from-literal=SECRETS_COOKIE='REPLACE_ME__openssl rand -hex 32' \
#     --from-literal=SECRETS_CIPHER='REPLACE_ME__exactly-32-bytes-hex'
apiVersion: v1
kind: Secret
metadata:
  name: morbeh-kratos-secrets
  namespace: morbeh-runtime
  labels:
    app.kubernetes.io/part-of: morbeh
type: Opaque
stringData:
  DSN: "REPLACE_ME__postgres://kratos:PASSWORD@postgres.data.svc.cluster.local:5432/kratos?sslmode=require"
  SECRETS_COOKIE: "REPLACE_ME__32-plus-char-random-value"
  SECRETS_CIPHER: "REPLACE_ME__exactly-32-bytes-hex"
---
#   kubectl -n morbeh-runtime create secret generic morbeh-keto-secrets \
#     --from-literal=DSN='postgres://keto:PASSWORD@postgres.data.svc.cluster.local:5432/keto?sslmode=require'
apiVersion: v1
kind: Secret
metadata:
  name: morbeh-keto-secrets
  namespace: morbeh-runtime
  labels:
    app.kubernetes.io/part-of: morbeh
type: Opaque
stringData:
  DSN: "REPLACE_ME__postgres://keto:PASSWORD@postgres.data.svc.cluster.local:5432/keto?sslmode=require"
---
# Phase A.34 (A.33 P0 #3) — the OAuth2 client secret admin-web exchanges its authorization code
# with. Must match exactly what the Hydra client was registered with
# (scripts/ops/register-oauth-client.mjs) — rotating one without the other breaks login instantly.
# admin-web's own code (lib/auth/config.ts) throws at import time in production if this is absent —
# no fallback, per A.33 P0 #3.
#   kubectl -n morbeh-runtime create secret generic morbeh-admin-web-secrets \
#     --from-literal=AUTH_CLIENT_SECRET='REPLACE_ME__openssl rand -hex 32'
apiVersion: v1
kind: Secret
metadata:
  name: morbeh-admin-web-secrets
  namespace: morbeh-runtime
  labels:
    app.kubernetes.io/part-of: morbeh
type: Opaque
stringData:
  AUTH_CLIENT_SECRET: "REPLACE_ME__32-plus-char-random-value"
