apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-scheduler
  namespace: morbeh-runtime
  labels:
    app.kubernetes.io/part-of: morbeh
    app.kubernetes.io/name: runtime-scheduler
    app.kubernetes.io/component: scheduler
spec:
  # Singleton: jobs are single-flight via the Redis distributed lock (Sprint 2.3), so extra
  # replicas add lock contention without throughput — no HPA. A rolling update briefly overlaps
  # two pods; the lock makes that safe.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: runtime-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: morbeh
        app.kubernetes.io/name: runtime-scheduler
        app.kubernetes.io/component: scheduler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: morbeh-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime-scheduler
          image: morbeh-runtime:local # production: a registry-pushed, immutable tag or digest
          imagePullPolicy: IfNotPresent
          args: ["node", "--import", "tsx", "src/scheduler.ts"]
          ports:
            - name: http
              containerPort: 3080 # health + metrics only
          envFrom:
            - configMapRef:
                name: morbeh-runtime-config
            - secretRef:
                name: morbeh-runtime-secrets
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
